services:
  - type: web
    name: mine-circ-ai
    runtime: python3
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --workers 1 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: lca_mining_circ_ai_2024_secure_key_9x7z3m8q5w2e1r4t6y
      - key: PYTHONPATH
        value: /opt/render/project/src
    regions:
      - oregon
